<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Natural</title>
<meta name="theme-color" content="#141211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna para celular, barra de navegação fixa embaixo, sessão de treino em tela cheia por cima. Tema único escuro (academia). */
:root{
  --bg:#141211;
  --surface:#1f1b19;
  --surface-2:#2a2522;
  --line:#3a332e;
  --ink:#f3ece6;
  --muted:#a89d94;
  --accent:#f08a3c;
  --accent-ink:#1a0f07;
  --good:#6fcf8e;
  --warn:#f2c14e;
  --bad:#ef6a5b;
  --body:#433a34;
  --mus:#665a50;
  --sec:rgba(240,138,60,.5);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top))!important;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
header.top h1 span{color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill.acc{border-color:var(--accent);color:var(--accent)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.good{border-color:var(--good);color:var(--good)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
section.view{padding-top:16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.label{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.next{border-color:var(--accent);background:linear-gradient(180deg,#2b1d13,var(--surface) 70%)}
.next h2{font-size:32px;line-height:1.05}
.wk{display:grid;gap:8px}
.wk-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.wk-item:hover{border-color:var(--muted)}
.letter{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent)}
.exlist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.exlist li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.exlist li:last-child{border-bottom:0}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.acc{color:var(--accent);border-color:#6b4122}
/* sessão */
#session{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;display:none}
#session.open{display:block}
#session .inner{max-width:640px;margin:0 auto;padding:0 16px 140px}
.s-head{position:sticky;top:0;padding-top:calc(12px + env(safe-area-inset-top))!important;background:var(--bg);z-index:2;padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.s-head h2{font-size:24px}
.ex{display:grid;gap:10px}
.ex h3{font-size:22px;line-height:1.1}
.sugg{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;padding:8px 10px;font-size:14.5px}
.sugg.stall{border-left-color:var(--warn)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:58px 1fr 1fr 1fr 44px;gap:6px;align-items:center}
.set.warmup{opacity:.8}
.set .tag{font-family:var(--display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);line-height:1.1}
.set.work .tag{color:var(--ink)}
.set input{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums}
.set input::placeholder{color:#6f655d}
.set .ro{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.chk{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;color:var(--muted)}
.chk.on{background:var(--good);border-color:var(--good);color:#0c2414}
.set-h{display:grid;grid-template-columns:58px 1fr 1fr 1fr 44px;gap:6px;font-size:12px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.set-h span:first-child{text-align:left}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:11;display:none;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:2px solid var(--accent)}
.timer.on{display:flex}
.timer .inner{max-width:640px;width:100%;display:flex;align-items:center;gap:12px;padding:0}
.timer .big{font-family:var(--display);font-size:40px;font-weight:700;min-width:96px;font-variant-numeric:tabular-nums;line-height:1}
.timer.done .big{color:var(--good)}
.timer.done{border-top-color:var(--good);animation:flash 1s ease-in-out 4}
@keyframes flash{50%{background:#1d3a26}}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent)}
/* volume */
.vol{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:118px 1fr 44px;gap:10px;align-items:center;font-size:14.5px}
.track{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.track .band{position:absolute;top:0;bottom:0;background:rgba(111,207,142,.14);border-left:1px dashed var(--good);border-right:1px dashed var(--good)}
.track .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--accent)}
.track .fill.low{background:var(--warn)}
.track .fill.high{background:var(--bad)}
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:14.5px}
.alerts li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--warn)}
.alerts li.info::before{background:var(--muted)}
.alerts li.ok::before{background:var(--good)}
/* forms */
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.phase{display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:10px}
.phase[aria-pressed="true"]{border-color:var(--accent);background:#2b1d13}
.phase .n{font-family:var(--display);font-size:22px;color:var(--muted)}
.phase[aria-pressed="true"] .n{color:var(--accent)}
.hist-item{display:grid;gap:6px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.spark{width:100%;height:150px;display:block}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
.edit-ex{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;display:none}
.toast.on{display:block}
.tree{display:grid;gap:10px}
.tree .q{font-weight:600}
@media (max-width:400px){
  .vrow{grid-template-columns:96px 1fr 40px;font-size:13.5px}
  .set,.set-h{grid-template-columns:50px 1fr 1fr 1fr 40px}
  .chk{width:40px}
}
.anim{position:relative;background:#fff;border-radius:8px;overflow:hidden;aspect-ratio:3/2;flex:none}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.anim img.f1{animation:frame 2.4s linear infinite}
@keyframes frame{0%,49.9%{opacity:0}50%,100%{opacity:1}}
.anim.noimg{display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-size:22px;color:var(--muted)}
.anim.th{width:56px}
.anim.md{width:124px}
.anim.lg{width:100%}
.mm{display:block;height:84px;width:auto;flex:none}
.mm.big{height:220px;max-width:100%}
.mmlab{fill:var(--muted);font-size:11px;font-family:var(--body)}
.exinfo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.legend{display:flex;gap:12px;justify-content:center;margin-top:4px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.exlist li.withimg{grid-template-columns:56px 1fr auto;align-items:center;cursor:pointer}
.exmedia{display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:8px}
@media (max-width:400px){.exinfo{grid-template-columns:1fr;justify-items:center}.mm.big{height:200px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Treino <span>Natural</span></h1>
    <div class="pills" id="hdrPills"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Seções"><div class="inner">
  <button data-tab="treinos" aria-current="page">Treinos</button>
  <button data-tab="volume">Volume</button>
  <button data-tab="plano">Plano</button>
  <button data-tab="historico">Histórico</button>
</div></nav>

<div id="session" role="dialog" aria-modal="true" aria-label="Treino em andamento"><div class="inner" id="sessionInner"></div></div>
<div class="timer" id="timer"><div class="inner">
  <div class="big" id="tBig">0:00</div>
  <div style="flex:1;display:grid;gap:6px">
    <div class="small muted" id="tLabel">Descanso</div>
    <div class="bar"><i id="tBar" style="width:0%"></i></div>
  </div>
  <button class="btn sm" id="tMinus" aria-label="Menos 15 segundos">−15</button>
  <button class="btn sm" id="tPlus" aria-label="Mais 15 segundos">+15</button>
  <button class="btn sm" id="tStop">Pular</button>
</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Regras do livro ================= */
const CATS = {
  mil:{n:"Multiarticular inferior livre",rmin:3,rmax:8,rpe:[6,8],multi:true,region:"inf"},
  mig:{n:"Multiarticular inferior guiado",rmin:6,rmax:12,rpe:[6,9],multi:true,region:"inf"},
  ai:{n:"Acessório inferior",rmin:8,rmax:20,rpe:[7,10],multi:false,region:"inf"},
  msl:{n:"Multiarticular superior livre",rmin:3,rmax:12,rpe:[6,9],multi:true,region:"sup"},
  msg:{n:"Multiarticular superior guiado",rmin:6,rmax:15,rpe:[6,10],multi:true,region:"sup"},
  as:{n:"Acessório superior",rmin:8,rmax:20,rpe:[7,10],multi:false,region:"sup"},
  core:{n:"Core / abdômen",region:"core"},
  prep:{n:"Preparatório (não conta volume)",region:"prep"}
};
const MUSCLES = {
  peito:"Peito", costas:"Costas", deltAnt:"Deltoide anterior", deltLat:"Deltoide lateral", deltPost:"Deltoide posterior",
  biceps:"Bíceps", triceps:"Tríceps", quad:"Quadríceps", isq:"Isquiotibiais", glut:"Glúteos", pant:"Panturrilha", abd:"Abdômen", eret:"Eretores"
};
const NO_BAND = ["eret"];
const WARM = {
  "0":{n:"Sem aquecimento",s:[]},
  "1":{n:"1 warming set",s:[[.4,12,"Aquec."]]},
  "2":{n:"2 warming sets",s:[[.4,12,"Aquec."],[.55,10,"Aquec."]]},
  "full":{n:"2 warming + 2 feeder",s:[[.4,12,"Aquec."],[.5,10,"Aquec."],[.6,6,"Feeder"],[.75,4,"Feeder"]]}
};
const PHASES = [
  {id:"livre",n:"Progressão linear",dur:"Sem prazo",rpe:8,t:"Recomendada pelo livro para quem nunca anotou cargas nem periodizou. Progrida carga, repetições ou séries a cada sessão. Se travar por 2 semanas seguidas, faça deload."},
  {id:"acum",n:"Acumulação",dur:"2 mesociclos",rpe:8,t:"RIR 2 na maior parte do tempo. Linear inversa: aumente o número de séries semana a semana. 40% do volume em multiarticulares a poucas repetições, 60% em máquinas e isoladores."},
  {id:"trans",n:"Transição para força",dur:"1 mesociclo",rpe:8,t:"Mantém volume e RIR 2, mas dá mais protagonismo aos exercícios de força (60% tensional). Progrida também no tempo de descanso e em pausas no sticky point."},
  {id:"intens",n:"Intensificação",dur:"1–2 mesociclos",rpe:9,t:"RIR 1. Carga sobe enquanto o volume cai (linear + ondulante). 70% do volume em compostos pesados, 30% em polias e isoladores."},
  {id:"teste",n:"Realização / teste",dur:"2 semanas",rpe:7.5,t:"Semana 1: menos séries, mesma faixa de reps, RPE 7–8. Semana 2: um AMRAP ou 1RM nos exercícios principais; nos demais, metade do volume."},
  {id:"hr",n:"Hipertrofia e resistência",dur:"4 mesociclos",rpe:9,t:"Volume volta a subir, esforço próximo da falha. Meso 1: 80% RM, 8×2 → 6×3 → 5×4 → 4×5. Meso 2: progressão de reps na top set. Meso 3: drop set. Meso 4: ondulante + super set de antagonistas."},
  {id:"hip",n:"Hipertrofia (pico)",dur:"2 mesociclos",rpe:9.5,t:"Volume máximo perto do seu MVR, 70% estresse metabólico. Meso 1: falsa pirâmide (1 técnica por grupo por sessão). Meso 2: RPE perto de 10 e, se precisar, um dia extra (full body, upper ou lower)."}
];
function restFor(reps, setIdx, unit){
  if(unit==="s") return 60;
  if(reps>=10) return 90;
  if(reps>=8) return 120;
  if(reps>=6) return 150;
  if(reps===5) return setIdx>=3 ? 210 : 180;
  return 240;
}
function restLabel(sec){
  const t = {90:"1:00–1:45",120:"1:45–2:15",150:"2:15–2:45",180:"2:30–3:30",210:"3:00–4:00",240:"3:30–4:30",60:"~1:00"}[sec];
  return t||fmt(sec);
}

/* ================= Programa inicial (das suas telas) ================= */
function E(id,name,cat,sets,rmin,rmax,load,inc,warm,prim,sec,extra){return Object.assign({id,name,cat,sets,rmin,rmax,load,inc,warm,prim,sec,unit:"reps",rpe:null,note:""},extra||{})}
const SEED = {
  v:3,
  settings:{level:"iniciante",phase:"livre",week:1,deload:false,ackFreq:true},
  workouts:[
    {id:"A",name:"Empurrar",sub:"Peito · Ombros · Tríceps · Abdômen",exercises:[
      E("supino-reto","Supino Reto (barra)","msl",4,9,9,40,2,"full",["peito"],["deltAnt","triceps"]),
      E("supino-decl","Supino Declinado (barra)","msl",3,9,9,40,2,"full",["peito"],["deltAnt","triceps"]),
      E("abd-decl","Abdominal Declinado","core",3,15,15,0,0,"0",["abd"],[]),
      E("cruc-polia","Crucifixo em pé (polia)","as",3,10,12,20,2.5,"2",["peito"],["deltAnt"],{note:"Reps subiram de 7–8 para 10–12: carga estimada, ajuste na 1ª sessão"}),
      E("abd-pernas","Abdominal com elevação das pernas","core",4,12,12,0,0,"0",["abd"],[]),
      E("elev-lat-front","Elevação Lateral e Frontal (halteres)","as",3,10,12,8,2,"2",["deltLat"],["deltAnt"],{note:"Reps subiram de 6–8 para 10–12: carga estimada"}),
      E("tri-tras","Extensão de Tríceps por Trás (polia)","as",3,8,9,40,2.5,"2",["triceps"],[])
    ]},
    {id:"B",name:"Puxar",sub:"Costas · Deltoide posterior · Bíceps · Abdômen",exercises:[
      E("remada-baixa","Remada Baixa (polia)","msg",3,9,9,80,5,"full",["costas"],["biceps","deltPost"]),
      E("remada-t","Remada T (máquina)","msg",3,8,8,40,2.5,"2",["costas"],["biceps","deltPost"]),
      E("cruc-inv","Crucifixo Inverso Sentado (máquina)","as",4,10,15,26,2.5,"2",["deltPost"],["costas"],{note:"Reps subiram de 7–11 para 10–15: carga estimada"}),
      E("face-pull","Face Pull (polia, corda)","as",3,12,15,15,2.5,"2",["deltPost"],["costas"],{note:"Novo: carga estimada, ajuste na 1ª sessão"}),
      E("rosca-alt","Rosca Alternada (halteres)","as",3,8,9,20,2,"2",["biceps"],[]),
      E("rosca-martelo","Rosca Martelo (halteres)","as",3,8,12,14,2,"2",["biceps"],[],{note:"Reps subiram de 5–6 para 8–12: carga estimada"}),
      E("prancha-b","Prancha abdominal","core",3,45,45,0,0,"0",["abd"],[],{unit:"s"})
    ]},
    {id:"C",name:"Pernas",sub:"Quadríceps · Posterior · Glúteos · Panturrilha",exercises:[
      E("agach-sumo","Agachamento Sumô (halteres)","mil",4,6,6,26,2,"full",["quad","glut"],["eret"]),
      E("stiff","Levantamento Terra Pernas Rígidas (stiff)","mil",4,5,5,30,2,"full",["glut","isq","eret"],[]),
      E("leg-press","Leg Press Inclinado","mig",3,9,10,100,10,"2",["quad","glut"],[]),
      E("extensora","Extensão de Pernas (máquina)","ai",3,8,10,60,5,"2",["quad"],[],{note:"Pode fazer em super set com a flexora deitado para ganhar tempo (antagonistas)"}),
      E("flexora","Flexão de Pernas Deitado (máquina)","ai",3,8,10,26,2.5,"2",["isq"],[]),
      E("flexora-sent","Flexão de Pernas Sentado (máquina)","ai",3,10,12,25,2.5,"2",["isq"],[],{note:"Novo: carga estimada, ajuste na 1ª sessão"}),
      E("pant-sent","Elevação de Panturrilha Sentado (máquina)","ai",5,12,15,30,5,"2",["pant"],[],{rpe:9}),

// Atualiza programas salvos na versão 1 com os ajustes, mantendo cargas já progredidas quando a faixa de reps não mudou
function migrate(p){
  if(!p||!p.workouts) return clone(SEED);
  if((p.v||1)===2){
    const RANK={"0":0,"1":1,"2":2,"full":3}, seedW={};
    SEED.workouts.forEach(w=>w.exercises.forEach(e=>seedW[e.id]=e.warm));
    p.workouts.forEach(w=>w.exercises.forEach(e=>{
      let t=seedW[e.id];
      if(!t) t=(e.load>0&&e.cat!=="prep"&&e.cat!=="core")?"2":e.warm;
      if((RANK[t]||0)>(RANK[e.warm]||0)) e.warm=t;
    }));
    p.v=3; migrated=true; return p;
  }
  if((p.v||1)>=3) return p;
  const old={};p.workouts.forEach(w=>w.exercises.forEach(e=>old[e.id]=e));
  const n=clone(SEED);
  n.settings=Object.assign({},p.settings||{},{ackFreq:true});
  n.workouts.forEach(w=>w.exercises.forEach(e=>{const o=old[e.id];if(o&&o.rmin===e.rmin&&o.rmax===e.rmax&&o.load)e.load=o.load}));
  migrated=true;
  return n;
}

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}
function kg(n){if(n==null||n==="")return "";return (Math.round(n*10)/10).toString().replace(".",",")}
function parseNum(v){if(v==null)return null;v=String(v).replace(",",".").trim();if(v==="")return null;const n=Number(v);return isNaN(n)?null:n}
function roundTo(n,step){step=step||1;return Math.round(n/step)*step}
function dstr(iso){const d=new Date(iso);return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}
function daysAgo(iso){const d=Math.floor((Date.now()-new Date(iso))/864e5);return d===0?"hoje":d===1?"ontem":d+" dias atrás"}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2600)}
function repsTxt(ex){const u=ex.unit==="s"?" s":"";return ex.rmin===ex.rmax?ex.rmin+u:ex.rmin+"–"+ex.rmax+u}
function phase(){return PHASES.find(p=>p.id===program.settings.phase)||PHASES[0]}
function targetRpe(ex){
  if(ex.rpe) return ex.rpe;
  const c=CATS[ex.cat]; const p=phase().rpe;
  if(!c||!c.rpe) return null;
  return Math.max(c.rpe[0],Math.min(c.rpe[1],p));
}
// 1RM estimado com reps em reserva (Epley + RIR)
function e1rm(kgv,reps,rpe){const rir=rpe!=null?Math.max(0,10-rpe):0;const r=reps+rir;return kgv>0?kgv*(1+r/30):r}

/* ================= Motor de progressão ================= */
function historyFor(exId){
  const out=[];
  for(const s of sessions){
    const e=(s.ex||[]).find(x=>x.exId===exId);
    if(!e) continue;
    const work=(e.sets||[]).filter(x=>x.done && x.kind==="work" && x.reps>0);
    if(work.length) out.push({date:s.date,deload:s.deload,sets:work,best:Math.max(...work.map(w=>e1rm(w.kg||0,w.reps,w.rpe)))});
  }
  return out; // mais recente primeiro
}
function suggest(ex){
  const st=program.settings, h=historyFor(ex.id).filter(x=>!x.deload);
  const res={load:ex.load,sets:eff(ex),reps:ex.rmax,text:"",stall:false,last:h[0]||null};
  if(st.deload){
    if(st.level==="iniciante"){res.load=ex.load?roundTo(ex.load*0.9,ex.inc||1):ex.load;res.text="Deload (iniciante): carga −10%, mesmas séries e repetições. Depois volte à carga anterior.";}
    else{res.sets=Math.max(1,Math.ceil(eff(ex)/2));res.text="Deload (intermediário): mesma carga, metade das séries.";}
    return res;
  }
  if(!h.length){res.text="Sem registro anterior. Use a carga do plano e anote tudo.";res.reps=ex.rmin;return res;}
  const last=h[0];
  const topKg=Math.max(...last.sets.map(s=>s.kg||0));
  const tr=targetRpe(ex);
  const allTop=last.sets.length>=ex.sets && last.sets.every(s=>s.reps>=ex.rmax && (s.kg||0)>=topKg-0.01);
  const overRpe=tr!=null && last.sets.some(s=>s.rpe!=null && s.rpe>tr+0.5);
  if(h.length>=3 && h[0].best<=h[2].best*1.005 && h[1].best<=h[2].best*1.005){res.stall=true;}
  if(ex.unit==="s"){
    res.load=topKg; res.reps=allTop?ex.rmax+5:ex.rmax;
    res.text=allTop?"Bateu o tempo em todas as séries: tente +5 s.":"Mantenha e busque o tempo alvo em todas as séries.";
  }else if(allTop && !overRpe){
    if(topKg>0 && ex.inc>0){res.load=topKg+ex.inc;res.reps=ex.rmin;res.text=`Você fez ${ex.rmax} reps em todas as séries: suba para ${kg(res.load)} kg e volte para ${ex.rmin} reps.`;}
    else{res.load=topKg;res.reps=ex.rmax+1;res.text="Topo da faixa em todas as séries. Sem carga extra: adicione peso ou suba a faixa de repetições.";}
  }else{
    const topReps=Math.max(...last.sets.filter(s=>(s.kg||0)>=topKg-0.01).map(s=>s.reps));
    res.load=topKg; res.reps=Math.min(ex.rmax,Math.max(ex.rmin,topReps+1));
    res.text=overRpe?`Última vez passou do RPE alvo (${tr}). Mantenha ${kg(topKg)} kg e foque em técnica.`
      :`Mantenha ${kg(topKg)} kg e tente ${res.reps} reps na top set (superar a top set é o principal).`;
  }
  const justAdded=ex.extra>0&&recentAdd(ex,8);
  if(justAdded&&res.stall) res.text+=" · Travou, mas está se recuperando bem: +1 série nesta semana, como no fluxograma do livro. Mantenha a carga e busque as reps em todas as séries.";
  else if(justAdded) res.text+=" · +1 série nesta semana (fase de acúmulo de volume).";
  else if(res.stall){
    res.text+= st.level==="iniciante"
      ?" · Sem progresso há 2 sessões: o livro sugere deload de −10% na carga por 1 semana."
      :" · Sem progresso há 2 sessões: o livro sugere deload de 50% do volume por 1 semana.";
  }
  return res;
}

/* ================= Séries automáticas (fluxograma do livro) ================= */
const VOL_PHASES=["acum","hr","hip"];
const MAX_EXTRA=2;
function capFor(level){return level==="avançado"?20:level==="intermediário"?17:14}
function eff(ex){return ex.sets+(ex.extra||0)}
function recentAdd(ex,days){return !!ex.extraAt && (Date.now()-new Date(ex.extraAt))<days*864e5}
// Chamada ao concluir um treino: soma 1 série onde o livro manda aumentar o volume
function autoSets(s){
  const st=program.settings; if(st.autoSets===false||s.deload) return [];
  const added=[], volPhase=VOL_PHASES.includes(st.phase), cap=capFor(st.level);
  for(const e of s.ex){
    const ex=findEx(e.exId); if(!ex||ex.cat==="core"||ex.cat==="prep"||ex.unit==="s") continue;
    if((ex.extra||0)>=MAX_EXTRA || recentAdd(ex,6)) continue;
    const work=e.sets.filter(x=>x.done&&x.kind==="work"&&x.reps>0);
    if(work.length<eff(ex)) continue;                                   // não completou as séries atuais
    const tr=targetRpe(ex);
    if(tr!=null && work.some(x=>x.rpe!=null&&x.rpe>tr+0.5)) continue;   // esforço acima do alvo: não está se recuperando bem
    const h=historyFor(ex.id).filter(x=>!x.deload);
    const stalled=h.length>=3 && h[0].best<=h[2].best*1.005 && h[1].best<=h[2].best*1.005;
    if(!volPhase && !stalled) continue;                                 // fora das fases de volume, só quando trava
    const {v}=weeklyVolume();
    if((ex.prim||[]).some(m=>!NO_BAND.includes(m)&&v[m]+1>cap) || (ex.sec||[]).some(m=>!NO_BAND.includes(m)&&v[m]+0.5>cap)) continue;
    ex.extra=(ex.extra||0)+1; ex.extraAt=new Date().toISOString(); added.push(ex.name+" ("+eff(ex)+" séries)");
  }
  return added;
}
function resetExtras(){let n=0;program.workouts.forEach(w=>w.exercises.forEach(e=>{if(e.extra)n++;e.extra=0;delete e.extraAt}));return n}

/* ================= Análise do programa (regras do livro) ================= */
function weeklyVolume(){
  const v={};Object.keys(MUSCLES).forEach(k=>v[k]=0);
  const freq={};Object.keys(MUSCLES).forEach(k=>freq[k]=new Set());
  for(const w of program.workouts)for(const ex of w.exercises){
    if(ex.cat==="prep") continue;
    const sets=program.settings.deload&&program.settings.level!=="iniciante"?Math.ceil(eff(ex)/2):eff(ex);
    (ex.prim||[]).forEach(m=>{v[m]+=sets;freq[m].add(w.id)});
    (ex.sec||[]).forEach(m=>{v[m]+=sets/2;freq[m].add(w.id)});
  }
  return {v,freq};
}
function analysis(){
  const out=[];const {v,freq}=weeklyVolume();
  const low=[],high=[];
  for(const k in v){if(NO_BAND.includes(k))continue;if(v[k]<10)low.push(MUSCLES[k]+" "+kg(v[k]));else if(v[k]>20)high.push(MUSCLES[k]+" "+kg(v[k]))}
  if(low.length) out.push({t:"Abaixo de 10 séries/semana: "+low.join(", ")+". O livro recomenda 10–20 (mais perto de 10 se iniciante). Some séries aos poucos, só se estiver progredindo e se recuperando bem.",k:"warn"});
  if(high.length) out.push({t:"Acima de 20 séries/semana: "+high.join(", ")+". Confira se você ainda progride entre sessões; se não, provavelmente passou do seu MVR.",k:"warn"});
  const legDays=new Set([...freq.quad,...freq.isq,...freq.glut]);
  if(legDays.size<2&&program.settings.ackFreq) out.push({t:"Pernas 1× por semana, por escolha sua (4 treinos semanais). O volume de pernas fica todo no Treino C.",k:"info"});
  else if(legDays.size<2) out.push({t:"Pernas aparecem em só 1 treino. O autor costuma usar frequência 2 para grupos grandes (membros inferiores e costas). Uma opção é levar parte do volume de pernas para outro dia, como nas divisões upper/lower do livro.",k:"warn"});
  if(freq.costas.size<2) out.push({t:"Costas em só 1 treino. Para grupos grandes, o livro sugere dividir o volume em 2 sessões.",k:"warn"});
  for(const w of program.workouts){
    let seenIso=null;
    for(const ex of w.exercises){
      const c=CATS[ex.cat]; if(!c||!c.rmin) continue;
      if(!c.multi&&!seenIso) seenIso=ex;
      if(c.multi&&seenIso&&CATS[seenIso.cat].region===c.region){out.push({t:`Treino ${w.id}: ${seenIso.name} vem antes de ${ex.name}. O livro coloca multiarticulares no início, quando o rendimento é maior (pré-exaustão só se for intencional).`,k:"warn"});break}
    }
  }
  const rr=[];
  for(const w of program.workouts)for(const ex of w.exercises){
    const c=CATS[ex.cat]; if(!c||!c.rmin||ex.unit==="s") continue;
    if(ex.rmin<c.rmin||ex.rmax>c.rmax) rr.push(`${ex.name} (${repsTxt(ex)}; livro: ${c.rmin}–${c.rmax})`);
  }
  if(rr.length) out.push({t:"Faixa de repetições fora da tabela do livro para o tipo de exercício: "+rr.join("; ")+". Isoladores rendem melhor com mais repetições, acumulando volume pelas reps.",k:"warn"});
  const wu=[],wf=[];
  for(const w of program.workouts)for(const ex of w.exercises){
    if((ex.cat==="msl"||ex.cat==="mil")&&ex.warm!=="full") wf.push(ex.name);
    else if(ex.load>0&&ex.cat!=="prep"&&ex.cat!=="core"&&(ex.warm==="0"||ex.warm==="1")) wu.push(ex.name);
  }
  if(wf.length) out.push({t:"Multiarticulares livres sem o aquecimento completo do livro (2 warming sets, a primeira a 40% da top set, mais 2 feeder sets longe da falha): "+wf.join(", ")+".",k:"info"});
  if(wu.length) out.push({t:"Com menos de 2 séries de aquecimento (o livro recomenda pelo menos 2 em qualquer exercício): "+wu.join(", ")+".",k:"info"});
  if(!out.some(a=>a.k==="warn")) out.push({t:"Tudo dentro das recomendações do livro.",k:"ok"});
  return out;
}

/* ================= Aquecimento inteligente ================= */
// Se todos os músculos primários do exercício já foram trabalhados antes no mesmo treino,
// o músculo já está aquecido: só feeders nos multiarticulares livres, 1 série leve nos demais.
function workoutOf(exId){return program.workouts.find(w=>w.exercises.some(e=>e.id===exId))||null}
function warmPlan(ex,w){
  const base=WARM[ex.warm]||WARM["0"];
  const plain={sets:base.s,n:base.n,red:false};
  if(program.settings.warmSmart===false||ex.warm==="0"||!(ex.prim||[]).length) return plain;
  w=w||workoutOf(ex.id); if(!w) return plain;
  const idx=w.exercises.findIndex(e=>e.id===ex.id), done=new Set();
  w.exercises.slice(0,Math.max(0,idx)).forEach(e=>{if(e.cat!=="prep"&&e.cat!=="core")(e.prim||[]).forEach(m=>done.add(m))});
  if(!ex.prim.every(m=>done.has(m))) return plain;
  if(ex.warm==="full") return {sets:[[.6,6,"Feeder"],[.75,4,"Feeder"]],n:"2 feeders (músculo já aquecido)",red:true};
  return {sets:[[.5,10,"Aquec."]],n:"1 série leve (músculo já aquecido)",red:true};
}

function drawChart(){
  const svg=$("#chart"); if(!svg||!chartEx) return;
  const h=historyFor(chartEx).slice().reverse();
  const ex=allExercises().find(e=>e.id===chartEx);
  const W=600,H=150,p=14;
  const ys=h.map(x=>x.best); const mn=Math.min(...ys)*0.97, mx=Math.max(...ys)*1.03||1;
  const X=i=>h.length===1?W/2:p+i*(W-2*p)/(h.length-1), Y=v=>H-p-(v-mn)/((mx-mn)||1)*(H-2*p);
  let grid=""; for(let i=0;i<4;i++){const y=p+i*(H-2*p)/3;grid+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#3a332e" stroke-width="1"/>`}
  const pts=h.map((x,i)=>`${X(i)},${Y(x.best)}`).join(" ");
  const area=h.length>1?`<polygon points="${X(0)},${H-p} ${pts} ${X(h.length-1)},${H-p}" fill="rgba(240,138,60,.15)"/>`:"";
  svg.innerHTML=grid+area+(h.length>1?`<polyline points="${pts}" fill="none" stroke="#f08a3c" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:"")+
    h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.best)}" r="${i===h.length-1?5:3}" fill="${i===h.length-1?"#f3ece6":"#f08a3c"}"/>`).join("");
  const first=h[0],last=h[h.length-1];const diff=first&&last&&first.best?((last.best/first.best-1)*100):0;
  const unit=ex&&ex.load>0?" kg":" reps";
  $("#chartNote").textContent=`${h.length} sessões · primeira ${kg(Math.round(first.best*10)/10)}${unit} → última ${kg(Math.round(last.best*10)/10)}${unit} (${diff>=0?"+":""}${kg(Math.round(diff*10)/10)}%)`;
}

function startSession(wid){
  const w=program.workouts.find(w=>w.id===wid); if(!w) return;

    if(!program.settings.deload && sg.load>0) for(const [pct,r,lab] of warmPlan(ex,w).sets) sets.push({kind:"warm",label:lab,kg:roundTo(sg.load*pct,ex.inc>=2?2:1),reps:r,rpe:null,done:false});
    for(let i=0;i<sg.sets;i++) sets.push({kind:"work",label:i===0?"Top":"S"+(i+1),kg:sg.load||null,reps:null,rpe:null,done:false,target:sg.reps});
    return {exId:ex.id,name:ex.name,cat:ex.cat,unit:ex.unit,sets,sugg:sg.text,stall:sg.stall,last:sg.last?sg.last.sets.map(s=>(s.kg?kg(s.kg)+"×":"")+s.reps+(s.rpe!=null?"@"+kg(s.rpe):"")).join(" · "):null,lastDate:sg.last?sg.last.date:null,target:`${sg.sets}×${repsTxt(ex)}`,rpe:targetRpe(ex)};

  lsSet(LS_LIVE,live); renderSession(); $("#session").classList.add("open"); $("#session").scrollTop=0; keepAwake(true);
}

      h+=`<div class="set ${w?"work":"warmup"}"><span class="tag">${esc(s.label)}</span>
        <input inputmode="decimal" aria-label="Carga" data-f="kg" data-e="${ei}" data-s="${si}" value="${s.kg!=null?kg(s.kg):""}" placeholder="${u?"—":"kg"}">
        <input inputmode="numeric" aria-label="${u?"Segundos":"Repetições"}" data-f="reps" data-e="${ei}" data-s="${si}" value="${s.reps!=null?s.reps:""}" placeholder="${w&&s.target?s.target:""}">
        ${w?`<input inputmode="decimal" aria-label="RPE" data-f="rpe" data-e="${ei}" data-s="${si}" value="${s.rpe!=null?kg(s.rpe):""}" placeholder="${e.rpe?kg(e.rpe):"RPE"}">`:`<span class="ro">leve</span>`}
        <button class="chk ${s.done?"on":""}" data-act="chk" data-e="${ei}" data-s="${si}" aria-pressed="${s.done}" aria-label="Marcar série">✓</button></div>`;
    });
    h+=`</div><div class="row"><button class="btn sm ghost" data-act="addset" data-e="${ei}">+ Série</button><button class="btn sm ghost" data-act="rmset" data-e="${ei}">− Série</button></div></div>`;
  });
  h+=`<div class="card field"><label for="sessNote">Observações (sono, dores, técnica)</label><textarea id="sessNote" rows="2">${esc(live.note||"")}</textarea></div>
    <button class="btn primary block" data-act="finish">Concluir treino</button><button class="btn ghost danger block" data-act="discard">Descartar treino</button></div>`;
  const y=$("#session").scrollTop; $("#sessionInner").innerHTML=h; $("#session").scrollTop=y;
}
async function finishSession(){
  const s=clone(live); s.dur=Math.round((Date.now()-s.start)/1000); s.date=new Date(s.start).toISOString();
  s.ex.forEach(e=>{delete e.sugg;delete e.last;delete e.lastDate;e.sets.forEach(x=>delete x.target)});
  const any=s.ex.some(e=>e.sets.some(x=>x.done&&x.kind==="work"));
  if(!any){toast("Marque pelo menos uma série de trabalho antes de concluir.");return}
  // a carga do plano acompanha a carga usada na top set
  if(!s.deload) for(const e of s.ex){const ex=findEx(e.exId);const w=e.sets.filter(x=>x.done&&x.kind==="work"&&x.kg>0);if(ex&&w.length) ex.load=Math.max(...w.map(x=>x.kg))}
  saveProgram();
  await saveSession(s);
  const added=autoSets(s); if(added.length) saveProgram();
  live=null; lsDel(LS_LIVE); stopTimer(); keepAwake(false); $("#session").classList.remove("open");
  tab="historico"; lsSet(LS_TAB,tab); render();
  if(added.length) openInfo("Volume aumentado","Treino salvo. +1 série a partir do próximo treino em: "+added.join("; ")+".");
  else toast("Treino salvo.");
}
function findEx(id){for(const w of program.workouts)for(const e of w.exercises)if(e.id===id)return e;return null}

/* ================= Cronômetro de descanso ================= */
let timer={end:0,total:0,iv:null,ctx:null,beeped:false,warned:false,ticks:{}};
function snd(){const st=program.settings;return {sound:st.sound!==false,vib:st.vib!==false,warn10:!!st.warn10}}
// Libera o áudio no primeiro toque (exigência do iPhone e do Chrome)
function unlockAudio(){
  try{
    if(navigator.audioSession) try{navigator.audioSession.type="transient"}catch(e){}
    if(!timer.ctx) timer.ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(timer.ctx.state==="suspended") timer.ctx.resume();
    const b=timer.ctx.createBuffer(1,1,22050),s=timer.ctx.createBufferSource();s.buffer=b;s.connect(timer.ctx.destination);s.start(0);
  }catch(e){}
}
document.addEventListener("pointerdown",unlockAudio,{passive:true});
function tone(freq,start,dur,vol,type){
  const c=timer.ctx;if(!c)return;
  const o=c.createOscillator(),g=c.createGain();o.type=type||"triangle";o.frequency.value=freq;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+start;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+dur-.05);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.02);
}
function playAlarm(){ if(!snd().sound) return; try{ if(timer.ctx&&timer.ctx.state==="suspended") timer.ctx.resume(); [0,.32,.64].forEach(t=>tone(1046,t,.24,.9,"square")); tone(1568,.96,.5,.9,"square"); }catch(e){} }
function playTick(){ if(!snd().sound) return; try{tone(660,0,.09,.5,"square")}catch(e){} }
function playWarn(){ if(!snd().sound) return; try{tone(784,0,.15,.6,"square");tone(784,.22,.15,.6,"square")}catch(e){} }
function vibrate(p){ if(!snd().vib) return; try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} }
// Mantém a tela acesa durante o treino para o aviso tocar na hora
let wake=null;
async function keepAwake(on){
  try{
    if(on&&!wake&&navigator.wakeLock&&document.visibilityState==="visible"){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}
    if(!on&&wake){await wake.release();wake=null}
  }catch(e){wake=null}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(live&&$("#session").classList.contains("open")) keepAwake(true);
  if(timer.iv) tick();
});
function startTimer(sec,label){
  unlockAudio();
  timer.total=sec; timer.end=Date.now()+sec*1000; timer.beeped=false; timer.warned=sec<=15; timer.ticks={};
  $("#tLabel").textContent=label; $("#timer").classList.add("on"); $("#timer").classList.remove("done");
  clearInterval(timer.iv); timer.iv=setInterval(tick,200); tick();
}
function tick(){
  const left=(timer.end-Date.now())/1000;
  $("#tBig").textContent=fmt(Math.max(0,Math.ceil(left)));
  $("#tBar").style.width=Math.max(0,Math.min(100,(1-left/timer.total)*100))+"%";
  if(snd().warn10&&!timer.warned&&left<=10&&left>9){timer.warned=true;playWarn();vibrate(80)}
  const s=Math.ceil(left);
  if(left>0&&s<=3&&!timer.ticks[s]){timer.ticks[s]=1;playTick()}
  if(left<=0&&!timer.beeped){
    timer.beeped=true;$("#timer").classList.add("done");$("#tLabel").textContent="Descanso concluído: próxima série";
    if(left>-30){playAlarm();vibrate([300,120,300,120,500])}
  }
  if(left<-90) stopTimer();
}
function stopTimer(){clearInterval(timer.iv);timer.iv=null;$("#timer").classList.remove("on","done")}
$("#tPlus").onclick=()=>{timer.end+=15000;timer.total+=15;timer.beeped=false;timer.ticks={};$("#timer").classList.remove("done")};
$("#tMinus").onclick=()=>{timer.end-=15000};
$("#tStop").onclick=stopTimer;

/* ================= Editor de treino ================= */
let editing=null;
function openEditor(wid){
  const w=program.workouts.find(w=>w.id===wid); editing=clone(w); renderEditor(); $("#modal").classList.add("open");
}
function renderEditor(){
  const w=editing;
  let h=`<div class="row between"><h2 style="font-size:24px">Editar treino ${esc(w.id)}</h2><button class="btn sm ghost" data-act="closem">Cancelar</button></div>
    <div class="grid2"><div class="field"><label for="wName">Nome</label><input id="wName" value="${esc(w.name)}"></div><div class="field"><label for="wSub">Descrição</label><input id="wSub" value="${esc(w.sub||"")}"></div></div>`;
  w.exercises.forEach((ex,i)=>{
    h+=`<div class="edit-ex" data-i="${i}"><div class="row between"><strong class="small">${i+1}.</strong><div class="row"><button class="btn sm" data-act="mv" data-i="${i}" data-d="-1" aria-label="Subir">↑</button><button class="btn sm" data-act="mv" data-i="${i}" data-d="1" aria-label="Descer">↓</button><button class="btn sm danger" data-act="rmex" data-i="${i}">Remover</button></div></div>
      <div class="field"><label for="n${i}">Exercício</label><input id="n${i}" data-k="name" value="${esc(ex.name)}"></div>
      <div class="field"><label for="g${i}">Imagem</label><select id="g${i}" data-k="img"><option value="" ${!ex.img?"selected":""}>Automática${imgKey(Object.assign({},ex,{img:""}))?" ("+esc(IMG_NAMES[imgKey(Object.assign({},ex,{img:""}))])+")":" (nenhuma)"}</option>${IMG_KEYS.map(k=>`<option value="${k}" ${ex.img===k?"selected":""}>${esc(IMG_NAMES[k])}</option>`).join("")}<option value="none" ${ex.img==="none"?"selected":""}>Sem imagem</option></select></div>
      <div class="field"><label for="c${i}">Tipo (define faixa de reps e RPE do livro)</label><select id="c${i}" data-k="cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${ex.cat===k?"selected":""}>${esc(c.n)}${c.rmin?` (${c.rmin}–${c.rmax}, RPE ${c.rpe[0]}–${c.rpe[1]})`:""}</option>`).join("")}</select></div>
      <div class="grid3"><div class="field"><label for="s${i}">Séries${ex.extra?` <span class="tiny" style="color:var(--accent)">+${ex.extra} auto</span>`:""}</label><input id="s${i}" data-k="sets" inputmode="numeric" value="${ex.sets}"></div>
      <div class="field"><label for="a${i}">${ex.unit==="s"?"Seg mín":"Reps mín"}</label><input id="a${i}" data-k="rmin" inputmode="numeric" value="${ex.rmin}"></div>
      <div class="field"><label for="b${i}">${ex.unit==="s"?"Seg máx":"Reps máx"}</label><input id="b${i}" data-k="rmax" inputmode="numeric" value="${ex.rmax}"></div></div>
      <div class="grid3"><div class="field"><label for="l${i}">Carga (kg)</label><input id="l${i}" data-k="load" inputmode="decimal" value="${kg(ex.load)}"></div>
      <div class="field"><label for="i${i}">Incremento</label><input id="i${i}" data-k="inc" inputmode="decimal" value="${kg(ex.inc)}"></div>
      <div class="field"><label for="r${i}">RPE fixo</label><input id="r${i}" data-k="rpe" inputmode="decimal" placeholder="pela fase" value="${ex.rpe?kg(ex.rpe):""}"></div></div>
      <div class="grid2"><div class="field"><label for="w${i}">Aquecimento</label><select id="w${i}" data-k="warm">${Object.entries(WARM).map(([k,v])=>`<option value="${k}" ${ex.warm===k?"selected":""}>${esc(v.n)}</option>`).join("")}</select></div>
      <div class="field"><label for="u${i}">Medida</label><select id="u${i}" data-k="unit"><option value="reps" ${ex.unit!=="s"?"selected":""}>Repetições</option><option value="s" ${ex.unit==="s"?"selected":""}>Segundos</option></select></div></div>
      <div class="field"><label>Músculos primários (série inteira)</label><div class="seg">${Object.entries(MUSCLES).map(([k,n])=>`<button data-act="mus" data-t="prim" data-m="${k}" data-i="${i}" aria-pressed="${(ex.prim||[]).includes(k)}">${n}</button>`).join("")}</div></div>
      <div class="field"><label>Secundários (meia série)</label><div class="seg">${Object.entries(MUSCLES).map(([k,n])=>`<button data-act="mus" data-t="sec" data-m="${k}" data-i="${i}" aria-pressed="${(ex.sec||[]).includes(k)}">${n}</button>`).join("")}</div></div></div>`;
  });
  h+=`<button class="btn block" data-act="addex">+ Adicionar exercício</button><div class="row"><button class="btn danger ghost" data-act="delw">Excluir treino</button><span style="flex:1"></span><button class="btn primary" data-act="savew">Salvar</button></div>`;
  $("#sheet").innerHTML=h;
}
function readEditorFields(){
  editing.name=$("#wName").value.trim()||editing.name; editing.sub=$("#wSub").value.trim();
  document.querySelectorAll(".edit-ex").forEach(box=>{
    const ex=editing.exercises[+box.dataset.i];
    box.querySelectorAll("[data-k]").forEach(inp=>{
      const k=inp.dataset.k, v=inp.value;
      if(["sets","rmin","rmax"].includes(k)) ex[k]=Math.max(1,parseInt(v)||ex[k]);
      else if(["load","inc"].includes(k)) ex[k]=parseNum(v)??0;
      else if(k==="rpe") ex[k]=parseNum(v);
      else ex[k]=v;
    });
    if(ex.rmax<ex.rmin) ex.rmax=ex.rmin;
  });
}

/* ================= Eventos ================= */
document.addEventListener("click",async ev=>{
  const tb=ev.target.closest("nav.tabs button");
  if(tb){tab=tb.dataset.tab;lsSet(LS_TAB,tab);render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, st=program.settings;
  if(a==="start"){ if(live){toast("Já existe um treino em andamento.");return} startSession(b.dataset.w); render(); }
  if(a==="resume"){ renderSession(); $("#session").classList.add("open"); keepAwake(true); }
  if(a==="minimize"){ $("#session").classList.remove("open"); keepAwake(false); render(); }
  if(a==="chk"){
    const e=live.ex[+b.dataset.e], s=e.sets[+b.dataset.s];
    s.done=!s.done;
    if(s.done&&s.kind==="work"&&s.reps==null&&s.target) s.reps=s.target;
    if(s.done&&s.kind==="work"&&s.rpe==null&&e.rpe) s.rpe=e.rpe;
    lsSet(LS_LIVE,live); renderSession();
    if(s.done){
      const workIdx=e.sets.filter(x=>x.kind==="work").indexOf(s);
      const sec=s.kind==="warm"?60:restFor(s.reps||s.target||8,workIdx,e.unit);
      startTimer(sec, s.kind==="warm"?"Aquecimento: descanso curto":`Descanso ${restLabel(sec)} (${s.reps||""} reps)`);
    }
  }
  if(a==="addset"){const e=live.ex[+b.dataset.e];const w=e.sets.filter(s=>s.kind==="work");const l=w[w.length-1]||{};e.sets.push({kind:"work",label:"S"+(w.length+1),kg:l.kg??null,reps:null,rpe:null,done:false,target:l.target});lsSet(LS_LIVE,live);renderSession()}
  if(a==="rmset"){const e=live.ex[+b.dataset.e];for(let i=e.sets.length-1;i>=0;i--){if(e.sets[i].kind==="work"&&!e.sets[i].done){e.sets.splice(i,1);break}}lsSet(LS_LIVE,live);renderSession()}
  if(a==="finish") await finishSession();
  if(a==="discard"){ openConfirm("Descartar este treino? O que foi marcado não será salvo.",()=>{live=null;lsDel(LS_LIVE);stopTimer();keepAwake(false);$("#session").classList.remove("open");render()}); }
  if(a==="sset"){const k=b.dataset.k;st[k]=k==="warn10"?!st[k]:st[k]===false;saveProgram();render()}
  if(a==="testsnd"){unlockAudio();playAlarm();vibrate([300,120,300])}
  if(a==="level"){st.level=b.dataset.v;saveProgram();render()}
  if(a==="deload"){const was=st.deload;st.deload=!st.deload;if(was&&resetExtras())toast("Deload encerrado: séries extras voltaram ao número base.");saveProgram();render()}
  if(a==="warmsmart"){st.warmSmart=st.warmSmart===false;saveProgram();render()}
  if(a==="autosets"){st.autoSets=st.autoSets===false;saveProgram();render()}
  if(a==="phase"){if(st.phase!==b.dataset.v){st.phase=b.dataset.v;st.week=1;if(resetExtras())toast("Nova fase: séries extras voltaram ao número base.")}saveProgram();render()}
  if(a==="wk"){st.week=Math.max(1,Math.min(16,st.week+(+b.dataset.d)));saveProgram();render()}
  if(a==="tree"){const v=b.dataset.v;if(v==="r")treeStep=0;else{const n=TREE[treeStep][v];treeStep=typeof n==="number"?n:n}render()}
  if(a==="delsess") openConfirm("Excluir esta sessão do histórico?",async()=>{await deleteSession(b.dataset.id);render()});
  if(a==="editw") openEditor(b.dataset.w);
  if(a==="exinfo"){ev.preventDefault();openExInfo(b.dataset.id)}
  if(a==="addw"){const used=new Set(program.workouts.map(w=>w.id));const id="ABCDEFGHIJ".split("").find(l=>!used.has(l))||("T"+Date.now()%1000);program.workouts.push({id,name:"Novo treino",sub:"",exercises:[]});saveProgram();openEditor(id)}
  if(a==="closem"){$("#modal").classList.remove("open");editing=null}
  if(a==="mv"){readEditorFields();const i=+b.dataset.i,j=i+(+b.dataset.d);if(j>=0&&j<editing.exercises.length){const x=editing.exercises;[x[i],x[j]]=[x[j],x[i]]}renderEditor()}
  if(a==="rmex"){readEditorFields();editing.exercises.splice(+b.dataset.i,1);renderEditor()}
  if(a==="addex"){readEditorFields();editing.exercises.push(E("ex"+Date.now().toString(36),"Novo exercício","as",3,8,12,0,2.5,"1",[],[]));renderEditor();$("#sheet").scrollTop=$("#sheet").scrollHeight}
  if(a==="mus"){readEditorFields();const ex=editing.exercises[+b.dataset.i],t=b.dataset.t,m=b.dataset.m;ex[t]=ex[t]||[];ex[t]=ex[t].includes(m)?ex[t].filter(x=>x!==m):[...ex[t],m];const o=t==="prim"?"sec":"prim";ex[o]=(ex[o]||[]).filter(x=>x!==m);const y=$("#sheet").scrollTop;renderEditor();$("#sheet").scrollTop=y}
  if(a==="savew"){readEditorFields();const i=program.workouts.findIndex(w=>w.id===editing.id);program.workouts[i]=editing;saveProgram();$("#modal").classList.remove("open");editing=null;render();toast("Treino atualizado.")}
  if(a==="delw"){const id=editing.id;openConfirm(`Excluir o treino ${id}? O histórico fica guardado.`,()=>{program.workouts=program.workouts.filter(w=>w.id!==id);saveProgram();editing=null;render()})}
  if(a==="export"){
    const txt=JSON.stringify({program,sessions});
    try{await navigator.clipboard.writeText(txt);toast("Backup copiado. Cole num lugar seguro.")}
    catch(e){openText("Copie este texto e guarde:",txt,false)}
  }
  if(a==="download"){
    const blob=new Blob([JSON.stringify({program,sessions})],{type:"application/json"});
    const url=URL.createObjectURL(blob);const l=document.createElement("a");l.href=url;l.download="treino-natural-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  if(a==="pickfile") $("#bkFile").click();
  if(a==="import") openText("Cole aqui o backup copiado antes:","",true);
  if(a==="doimport"){
    try{const d=JSON.parse($("#ioText").value);if(!d.program||!d.program.workouts)throw 0;program=d.program;saveProgram();for(const s of (d.sessions||[]))await saveSession(s);$("#modal").classList.remove("open");render();toast("Backup restaurado.")}
    catch(e){toast("Esse texto não é um backup válido deste app.")}
  }
  if(a==="reset") openConfirm("Substituir seus treinos pelo programa inicial? O histórico continua.",()=>{program=clone(SEED);saveProgram();render()});
  if(a==="confirm-yes"){const f=confirmFn;confirmFn=null;$("#modal").classList.remove("open");f&&await f()}
});
document.addEventListener("keydown",ev=>{
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches('[role="button"][data-act]')){ev.preventDefault();ev.target.click()}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="sessNote"&&live){live.note=t.value;lsSet(LS_LIVE,live);return}
  if(t.dataset&&t.dataset.f&&live){
    const s=live.ex[+t.dataset.e].sets[+t.dataset.s];
    const v=t.dataset.f==="reps"?(parseInt(t.value)||null):parseNum(t.value);
    s[t.dataset.f]=v; lsSet(LS_LIVE,live);
  }
});
document.addEventListener("change",async ev=>{
  if(ev.target.id==="chartSel"){chartEx=ev.target.value;drawChart()}
  if(ev.target.id==="bkFile"&&ev.target.files[0]){const t=await ev.target.files[0].text();const box=$("#ioText");if(box)box.value=t;ev.target.value=""}
});
let confirmFn=null;
function openInfo(title,msg){$("#sheet").innerHTML=`<h2 style="font-size:24px">${esc(title)}</h2><p>${esc(msg)}</p><div class="row"><button class="btn primary" data-act="closem">Entendi</button></div>`;$("#modal").classList.add("open")}
function openConfirm(msg,fn){confirmFn=fn;$("#sheet").innerHTML=`<p>${esc(msg)}</p><div class="row"><button class="btn" data-act="closem">Cancelar</button><button class="btn primary" data-act="confirm-yes">Confirmar</button></div>`;$("#modal").classList.add("open")}
function openText(msg,val,isImport){$("#sheet").innerHTML=`<div class="field"><label for="ioText">${esc(msg)}</label><textarea id="ioText" rows="8" ${isImport?"":"readonly"}>${esc(val)}</textarea></div><div class="row"><button class="btn" data-act="closem">Fechar</button>${isImport?'<button class="btn" data-act="pickfile">Escolher arquivo</button><button class="btn primary" data-act="doimport">Restaurar</button>':""}</div>`;$("#modal").classList.add("open");if(!isImport){const t=$("#ioText");t.focus();t.select()}}
$("#modal").addEventListener("click",ev=>{if(ev.target.id==="modal"){$("#modal").classList.remove("open");editing=null}});

initStore();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
